[project]
name = "omni-analyst-v2"
version = "0.1.0"
description = "Demand-driven coverage network with agentic gap-filling"
requires-python = ">=3.11"
dependencies = [
    "neutron-py",
    "asyncpg>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    # Neutron's auth tier requires a password-hashing backend; neutron.auth
    # .password raises ImportError without one. PyJWT[crypto] backs token
    # signing for the same reason.
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    # Ceilinged at pandas 2.x deliberately. v1 pins numpy==2.2.6 / pandas==2.3.0
    # and its test suites are the acceptance oracle for every ported module. On
    # pandas 3 Copy-on-Write is the default, so the chained assignment those
    # fixtures use (df["high"].iloc[-12:] = ...) silently does nothing and the
    # fixture never gets the state it claims to set. The ported code itself is
    # clean; the fixtures are not. Raising this ceiling means auditing them.
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    # Required by the ported perception engines: LedoitWolf shrinkage and
    # graph clustering in herding, SARIMAX/VAR in dynamics. W2 correctly
    # skipped four tests rather than adding these itself.
    "scipy>=1.15,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<1",
    "networkx>=3.0,<4",
    # Unifies 100+ crypto venues behind one interface. Pinned at the 4.x line:
    # the 4.x series is the long-stable unified API (fetch_ohlcv, the exception
    # taxonomy NetworkError/BadSymbol/etc.); a 5.x ceiling is set defensively
    # because ccxt's major bumps have historically renamed exchange ids and
    # reshaped the async_support surface, which would silently move the venue
    # an adapter targets.
    "ccxt>=4.0,<5",
    "yfinance>=1.5.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv.sources]
neutron-py = { path = "../../Neutron/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# The execution tier is deliberately unwired (policy: analysis describes,
# execution acts). Its blind-except patterns never run in production, so the
# broad catches are documented isolation rather than swallowed bugs.
[tool.ruff.lint.per-file-ignores]
"src/omni/execution/*" = ["BLE001", "S110"]
