[project]
name = "omni-analyst-v2"
version = "0.1.0"
description = "Demand-driven coverage network with agentic gap-filling"
requires-python = ">=3.11"
dependencies = [
    "neutron-py",
    "asyncpg>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    # Ceilinged at pandas 2.x deliberately. v1 pins numpy==2.2.6 / pandas==2.3.0
    # and its test suites are the acceptance oracle for every ported module. On
    # pandas 3 Copy-on-Write is the default, so the chained assignment those
    # fixtures use (df["high"].iloc[-12:] = ...) silently does nothing and the
    # fixture never gets the state it claims to set. The ported code itself is
    # clean; the fixtures are not. Raising this ceiling means auditing them.
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv.sources]
neutron-py = { path = "../../Neutron/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
