name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is ~3,200 tests and runs in 2-8 minutes. Bounded so a hung
    # postgres service fails in twenty minutes rather than inheriting GitHub's
    # 360-minute default and burning six hours of runner time.
    timeout-minutes: 20

    services:
      postgres:
        # Matches the prod/dev compose image so migration behaviour is identical.
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_DB: omni_v2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omni_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/omni_v2_test
      OMNI_JWT_SECRET: ci-secret-at-least-thirty-two-characters-long

    steps:
      - uses: actions/checkout@v4
        with:
          # The repo must land where the editable dependency below expects it,
          # relative to a sibling Neutron checkout.
          path: omni-analyst/app-v2

      # pyproject declares `neutron-py = { path = "../../Neutron/python",
      # editable = true }` -- a path OUTSIDE this repository. Without this step
      # `uv sync` fails before a single test runs:
      #
      #   error: Failed to generate package metadata for
      #     `neutron-py==0.1.0 @ editable+../../Neutron/python`
      #     Caused by: Distribution not found at: file:///.../Neutron/python
      #
      # The Dockerfile works around it by exporting frozen requirements with
      # `grep -vE 'neutron-py'` and installing a prebuilt wheel from vendor/,
      # which is gitignored and so unavailable here. Neutron is public, so CI
      # checks it out at the path the dependency already names rather than
      # teaching the build a second way to find it.
      - uses: actions/checkout@v4
        with:
          repository: neutron-build/neutron
          path: Neutron

      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
        working-directory: omni-analyst/app-v2
        # Tests were outside the lint scope, and drifted to 41 findings before
        # anyone looked. They are code -- a test asserting the wrong thing is a
        # worse defect than a lint error in src/, because it reports green.
      # `ruff format --check` is deliberately NOT run. 209 of 277 files would
      # be reformatted; the repo has never been formatter-clean and adding it
      # would make CI red on arrival for reasons unrelated to any change.
      # `ruff check` is the house gate and it passes.
      - run: uv run ruff check
        working-directory: omni-analyst/app-v2
      - run: uv run pytest -q
        working-directory: omni-analyst/app-v2
      - name: Test persisted historical-schema upgrades
        run: uv run python ci/historical_schema_upgrade.py
        working-directory: omni-analyst/app-v2

  ui:
    # The Preact app's typecheck, tests, and build were entirely outside CI;
    # a broken UI merge reached main undetected and was discovered at deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run test
      - run: npm --prefix ui run build
      - run: npm --prefix ui run test:browser:ci

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: omni-analyst/app-v2
      - uses: actions/checkout@v4
        with:
          repository: neutron-build/neutron
          path: Neutron
      - uses: astral-sh/setup-uv@v3
      - name: Build and boot production images
        run: ./ci/production_smoke.sh ../../Neutron/python
        working-directory: omni-analyst/app-v2
